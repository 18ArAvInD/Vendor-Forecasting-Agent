[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-forecasting-agent"
version = "0.1.0"
description = "Vendor Forecasting Agent - deterministic core and orchestration MVP"
requires-python = "==3.11.*"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
ui = ["streamlit>=1.30,<2"]
llm = ["boto3>=1.34,<2"]
mistral = ["mistralai>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
